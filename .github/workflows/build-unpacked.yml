name: Build unpacked Windows app

on:
  workflow_dispatch:
    inputs:
      arch:
        description: "Target CPU architecture"
        required: true
        default: x64
        type: choice
        options:
          - x64
          - arm64
      tag:
        description: "Release tag (empty = v<package version>; same tag collects both arch zips)"
        required: false
        default: ""
        type: string
      draft:
        description: "Create the release as a draft"
        required: false
        default: false
        type: boolean
      prerelease:
        description: "Mark the release as a pre-release"
        required: false
        default: false
        type: boolean

concurrency:
  # 同一 release tag 的构建串行执行，避免 x64/arm64 同时创建同一个 release 时互相冲突。
  group: build-unpacked-${{ github.ref }}-${{ inputs.tag || 'default' }}
  cancel-in-progress: false

permissions:
  # 发布 release 并上传 zip 附件需要写权限。
  contents: write

env:
  # 与本地发布构建保持一致：生产身份、关闭遥测上报与自动更新、跳过代码签名。
  ZCODE_ENV: production
  ZCODE_ARMS_RUM_ENDPOINT: ""
  ZCODE_TELEMETRY_REPORT_ENDPOINT: ""
  ZCODE_AUTO_UPDATE: "0"
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

jobs:
  build:
    name: Windows ${{ inputs.arch }} unpacked
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.2

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # --dir 让 electron-builder 只产出 win-*-unpacked 目录，不生成 NSIS 安装包。
      - name: Build unpacked app
        run: pnpm bundle:desktop -- --os win --arch ${{ inputs.arch }} --dir

      - name: Zip unpacked app
        id: package
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $arch = "${{ inputs.arch }}"
          $unpacked = if ($arch -eq "arm64") {
            "packages/desktop/dist/win-arm64-unpacked"
          } else {
            "packages/desktop/dist/win-unpacked"
          }
          if (-not (Test-Path $unpacked)) {
            throw "Missing unpacked directory: $unpacked"
          }
          $zip = "packages/desktop/dist/ZCode-$version-win-$arch-unpacked.zip"
          # 压缩目录内容而不是目录本身，解压后根目录直接是 ZCode.exe。
          Compress-Archive -Path (Join-Path $unpacked "*") -DestinationPath $zip -CompressionLevel Optimal
          # 默认 tag 用 v<version>：x64/arm64 分两次跑也会补齐到同一个 release。
          $tag = "${{ inputs.tag }}".Trim()
          if (-not $tag) { $tag = "v$version" }
          $sizeMb = [math]::Round((Get-Item $zip).Length / 1MB, 1)
          "zip=$zip" >> $env:GITHUB_OUTPUT
          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$tag" >> $env:GITHUB_OUTPUT
          @(
            "### ZCode $version (win-$arch, unpacked)"
            ""
            "- Zip: ``$zip``"
            "- Size: $sizeMb MiB"
            "- Release tag: ``$tag``"
            "- No installer; unzip and run ``ZCode.exe``."
          ) -join "`n" >> $env:GITHUB_STEP_SUMMARY

      - name: Publish release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.package.outputs.tag }}
          name: ZCode ${{ steps.package.outputs.version }} (Windows unpacked)
          body: |
            ZCode ${{ steps.package.outputs.version }} — Windows unpacked build.

            - Asset: `ZCode-${{ steps.package.outputs.version }}-win-${{ inputs.arch }}-unpacked.zip`
            - No installer is produced; unzip the archive and run `ZCode.exe`.
            - Unsigned build; telemetry and auto-update are disabled.
          draft: ${{ inputs.draft }}
          prerelease: ${{ inputs.prerelease }}
          files: ${{ steps.package.outputs.zip }}
          fail_on_unmatched_files: true
